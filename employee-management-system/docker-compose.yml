services:
  db:
    container_name: postgres-spring-boot
    image: postgres:18
    environment:
      POSTGRES_USER: maksluczak
      POSTGRES_PASSWORD: S3cret
      POSTGRES_DB: company_db
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5332:5432"
    networks:
      - db
    restart: unless-stopped

networks:
  db:
    driver: bridge
volumes:
  db: