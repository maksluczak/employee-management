name: employee-management

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: maksluczak
      POSTGRES_PASSWORD: S3cret
      POSTGRES_DB: company_db
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5332:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U maksluczak -d company_db" ]
      interval: 5s
      retries: 10

  backend:
    build: ./employee-management-system
    environment:
      DB_URL: jdbc:postgresql://db:5432/company_db
      DB_USERNAME: maksluczak
      DB_PASSWORD: S3cret
    volumes:
      - ~/.aws:/root/.aws:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db: